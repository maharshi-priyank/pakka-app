# Manual deploys only — no auto-deploy on push. Trigger from the GitHub
# Actions tab: Actions → Deploy to Vercel → Run workflow.
#
# Requires Vercel's automatic Git deployments to be DISABLED for this
# project (Vercel dashboard → Project → Settings → Git → disconnect /
# disable auto-deploy), otherwise Vercel will also deploy on every push
# independently of this workflow.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      — from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — from .vercel/project.json after `vercel link`, or the team settings URL
#   VERCEL_PROJECT_ID  — from .vercel/project.json after `vercel link`, or the project settings URL

name: Deploy to Vercel
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying to production'
        required: true

jobs:
  deploy:
    name: Build and deploy (production)
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Guard against accidental runs
        if: github.event.inputs.confirm != 'deploy'
        run: |
          echo "::error::Input 'confirm' must be exactly 'deploy' to proceed. Got: '${{ github.event.inputs.confirm }}'"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
